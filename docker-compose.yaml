version: '3.8'

services:
  router:
    build:
      context: .
      dockerfile: docker/Dockerfile.router
    container_name: inference-router
    command: ["--config", "config.yaml"]
    ports:
      - "8080:8080"     # HTTP Management & Web Console
      - "50051:50051"   # High-Throughput gRPC Inference
    environment:
      - INFERENCE_ROUTER_PORT=8080
      - INFERENCE_ROUTER_GRPC_PORT=50051
      - INFERENCE_STORAGE_REDIS_ADDR=redis:6379
      - INFERENCE_TRACING_ENDPOINT=jaeger:4318
    depends_on:
      - mock-triton
      - prometheus
      - jaeger
      - redis
    restart: unless-stopped

  mock-triton:
    image: python:3.11-slim
    container_name: mock-triton-cluster
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: python3 scripts/mock_triton_cluster.py --base-port 8100 --host 0.0.0.0
    ports:
      - "8100-8107:8100-8107"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: inference-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: inference-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: inference-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger Web UI
      - "4318:4318"     # OTLP HTTP receiver
      - "4317:4317"     # OTLP gRPC receiver
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inference-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: inference-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # MinIO Web Console
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "distributed-gpu-inference.fullname" . }}-triton
  labels:
    {{- include "distributed-gpu-inference.labels" . | nindent 4 }}
    component: triton
spec:
  serviceName: {{ include "distributed-gpu-inference.fullname" . }}-triton-svc
  replicas: {{ .Values.triton.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "distributed-gpu-inference.name" . }}
      component: triton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "distributed-gpu-inference.name" . }}
        component: triton
    spec:
      {{- with .Values.triton.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.triton.nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: triton
          image: "{{ .Values.triton.image.repository }}:{{ .Values.triton.image.tag }}"
          imagePullPolicy: {{ .Values.triton.image.pullPolicy }}
          args:
            - tritonserver
            - --model-repository={{ .Values.triton.modelRepositoryPath }}
            - --strict-model-config=false
            - --log-verbose=0
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          resources:
            {{- toYaml .Values.triton.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10


apiVersion: 1

providers:
  - name: 'Distributed GPU Inference Dashboards'
    orgId: 1
    folder: 'GPU Inference'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

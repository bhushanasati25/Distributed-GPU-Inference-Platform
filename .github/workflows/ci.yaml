name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-go:
    name: Go Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Build Go Router Binary
        run: CGO_ENABLED=0 go build -v -o bin/inference-router cmd/router/main.go

  test-python:
    name: Python Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install -e .

      - name: Run Python Pytest Suite
        run: pytest -v python/tests/

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate Dev Kustomize Overlay
        run: kubectl kustomize k8s/overlays/dev > /dev/null

      - name: Validate Prod Kustomize Overlay
        run: kubectl kustomize k8s/overlays/prod > /dev/null

  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Router Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.router
          push: false
          tags: distributed-gpu-inference/router:test

      - name: Build Pipeline Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.pipeline
          push: false
          tags: distributed-gpu-inference/pipeline:test


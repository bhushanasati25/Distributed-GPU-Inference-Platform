apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: inference

namePrefix: dev-

labels:
  - pairs:
      environment: dev
      tier: inference-dev

resources:
  - ../../base
  - ../../router
  - ../../storage

patches:
  - target:
      kind: StatefulSet
      name: triton-inference-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value:
          cpu: "1"
          memory: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: "2"
          memory: 4Gi
  - target:
      kind: Deployment
      name: inference-router
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

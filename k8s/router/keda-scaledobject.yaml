# =============================================================================
# KEDA ScaledObject: Inference Router
# =============================================================================
# Dynamically scales Go router replicas based on active priority queue depth
# scraped from Prometheus metrics.
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: router-queue-scaler
  namespace: inference
  labels:
    app: distributed-gpu-inference
    component: router
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-router
  minReplicaCount: 3
  maxReplicaCount: 15
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    # Trigger 1: Autoscaling based on Router Priority Queue Depth
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-service.monitoring.svc.cluster.local:9090
        metricName: router_queue_depth
        threshold: "200" # Scale up when average queue depth exceeds 200 items
        query: sum(router_queue_depth)

    # Trigger 2: Autoscaling based on High Influx RPS
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-service.monitoring.svc.cluster.local:9090
        metricName: router_requests_rate
        threshold: "500" # Scale up when RPS per router pod exceeds 500 req/s
        query: sum(rate(router_requests_total[1m]))


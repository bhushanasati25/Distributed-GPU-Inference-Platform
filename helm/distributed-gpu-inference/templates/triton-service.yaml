apiVersion: v1
kind: Service
metadata:
  name: {{ include "distributed-gpu-inference.fullname" . }}-triton-svc
  labels:
    {{- include "distributed-gpu-inference.labels" . | nindent 4 }}
    component: triton
spec:
  clusterIP: None # Headless service for StatefulSet identity
  ports:
    - port: 8000
      name: http
    - port: 8001
      name: grpc
    - port: 8002
      name: metrics
  selector:
    app.kubernetes.io/name: {{ include "distributed-gpu-inference.name" . }}
    component: triton


# =============================================================================
# MinIO Credentials Secret
# =============================================================================
# Stores the MinIO root user and password as base64-encoded values.
#
# WARNING: In production, use a proper secrets management solution such as:
#   - Kubernetes External Secrets (with AWS Secrets Manager, GCP Secret Manager)
#   - HashiCorp Vault with the Vault Secrets Operator
#   - Sealed Secrets (Bitnami)
#
# Default placeholder values (base64-encoded):
#   MINIO_ROOT_USER:     minioadmin        -> bWluaW9hZG1pbg==
#   MINIO_ROOT_PASSWORD: minioadmin123     -> bWluaW9hZG1pbjEyMw==
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: data
  labels:
    app: distributed-gpu-inference
    component: minio
  annotations:
    description: "MinIO root credentials - REPLACE with production values"
type: Opaque
data:
  # echo -n "minioadmin" | base64
  MINIO_ROOT_USER: bWluaW9hZG1pbg==
  # echo -n "minioadmin123" | base64
  MINIO_ROOT_PASSWORD: bWluaW9hZG1pbjEyMw==

# =============================================================================
# Jaeger All-in-One Deployment for Distributed Inference Tracing
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: distributed-gpu-inference
    component: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: distributed-gpu-inference
      component: jaeger
  template:
    metadata:
      labels:
        app: distributed-gpu-inference
        component: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.52
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
              name: query-ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 14268
              name: jaeger-collector
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-service
  namespace: monitoring
  labels:
    app: distributed-gpu-inference
    component: jaeger
spec:
  type: ClusterIP
  ports:
    - port: 16686
      targetPort: query-ui
      name: ui
    - port: 4317
      targetPort: otlp-grpc
      name: otlp-grpc
    - port: 4318
      targetPort: otlp-http
      name: otlp-http
  selector:
    app: distributed-gpu-inference
    component: jaeger


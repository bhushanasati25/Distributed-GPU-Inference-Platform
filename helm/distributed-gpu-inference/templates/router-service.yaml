apiVersion: v1
kind: Service
metadata:
  name: {{ include "distributed-gpu-inference.fullname" . }}-router-svc
  labels:
    {{- include "distributed-gpu-inference.labels" . | nindent 4 }}
    component: router
spec:
  type: {{ .Values.router.service.type }}
  ports:
    - port: {{ .Values.router.service.grpcPort }}
      targetPort: grpc
      name: grpc
    - port: {{ .Values.router.service.httpPort }}
      targetPort: http
      name: http
    - port: {{ .Values.router.service.metricsPort }}
      targetPort: metrics
      name: metrics
  selector:
    app.kubernetes.io/name: {{ include "distributed-gpu-inference.name" . }}
    component: router


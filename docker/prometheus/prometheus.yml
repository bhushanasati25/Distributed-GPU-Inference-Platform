global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'inference-router'
    static_configs:
      - targets: ['router:8080']
    metrics_path: '/metrics'

  - job_name: 'mock-triton-cluster'
    static_configs:
      - targets:
          - 'mock-triton:8100'
          - 'mock-triton:8101'
          - 'mock-triton:8102'
          - 'mock-triton:8103'
    metrics_path: '/metrics'

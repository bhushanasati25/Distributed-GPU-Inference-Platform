# =============================================================================
# Prometheus StatefulSet Deployment
# =============================================================================
# Deploys Prometheus as a StatefulSet with a 50Gi PVC for metrics storage.
# Includes a ServiceAccount with ClusterRole for Kubernetes API-based
# service discovery across all namespaces.
# =============================================================================

# ServiceAccount for Prometheus to access the Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: distributed-gpu-inference
    component: prometheus
---
# ClusterRole granting read-only access to Kubernetes resources
# required for service discovery and kube-state-metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: distributed-gpu-inference
    component: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
# ClusterRoleBinding connecting the ServiceAccount to the ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: distributed-gpu-inference
    component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
# Prometheus StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: distributed-gpu-inference
    component: prometheus
  annotations:
    description: "Prometheus time-series database for inference platform monitoring"
spec:
  replicas: 1
  serviceName: prometheus-headless
  selector:
    matchLabels:
      app: distributed-gpu-inference
      component: prometheus
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: distributed-gpu-inference
        component: prometheus
    spec:
      serviceAccountName: prometheus
      terminationGracePeriodSeconds: 300

      # Security context: run as nobody user (65534)
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true

      containers:
        - name: prometheus
          image: prom/prometheus:v2.49.1
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.retention.size=45GB
            - --web.enable-lifecycle
            - --web.enable-admin-api
            - --web.console.libraries=/etc/prometheus/console_libraries
            - --web.console.templates=/etc/prometheus/consoles

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi

          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-rules
          configMap:
            name: alertmanager-rules
            optional: true

  # Persistent storage for Prometheus TSDB
  volumeClaimTemplates:
    - metadata:
        name: prometheus-data
        labels:
          app: distributed-gpu-inference
          component: prometheus
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        # storageClassName: fast-ssd
---
# Headless service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: prometheus-headless
  namespace: monitoring
  labels:
    app: distributed-gpu-inference
    component: prometheus
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: distributed-gpu-inference
    component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
# ClusterIP service for Prometheus access
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: distributed-gpu-inference
    component: prometheus
  annotations:
    description: "Prometheus web UI and API"
spec:
  type: ClusterIP
  selector:
    app: distributed-gpu-inference
    component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
